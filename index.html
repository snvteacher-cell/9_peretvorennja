<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажер: перетворення графіків</title>
<style>:root{--bg:#eef2f6;--card:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#c9d3de;--acc:#2457b3;--accsoft:#e3ebf9;--ok:#1d7a4c;--oksoft:#e1f3e9;--bad:#c23b2e;--badsoft:#fbe6e3;
 --or:#d9661f;--orsoft:#fcebdf;--blue:#2457b3;--plbg:#fff;--plgrid:#e3e8ee;--plax:#33404f;--ghost:#8f9aa6;--k1:#c23b2e;--k2:#1d7a4c;--k3:#7b3fa8;--inbg:#fff;
 --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a22;--card:#1d2530;--ink:#e7edf4;--muted:#9aa8b8;--line:#33404f;--acc:#7ea6f0;--accsoft:#22324d;--ok:#5cc58f;--oksoft:#183427;--bad:#f07a6c;--badsoft:#3b1f1c;
 --or:#f0a35c;--orsoft:#3a2a1b;--blue:#7ea6f0;--plbg:#18202a;--plgrid:#26303c;--plax:#b8c4d2;--ghost:#7d8a99;--k1:#f07a6c;--k2:#5cc58f;--k3:#c39af0;--inbg:#141a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--card:#1d2530;--ink:#e7edf4;--muted:#9aa8b8;--line:#33404f;--acc:#7ea6f0;--accsoft:#22324d;--ok:#5cc58f;--oksoft:#183427;--bad:#f07a6c;--badsoft:#3b1f1c;
 --or:#f0a35c;--orsoft:#3a2a1b;--blue:#7ea6f0;--plbg:#18202a;--plgrid:#26303c;--plax:#b8c4d2;--ghost:#7d8a99;--k1:#f07a6c;--k2:#5cc58f;--k3:#c39af0;--inbg:#141a22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;
 padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:clamp(24px,5vw,32px);font-weight:800}
.hint{font-size:14px;color:var(--muted)}
.bar{display:flex;gap:4px}.bar span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar span.ok{background:var(--ok)}.bar span.bad{background:var(--bad)}.bar span.cur{outline:2px solid var(--acc);outline-offset:1px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:600}
.badge{font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;color:#fff;background:var(--acc)}
.badge.pr{background:var(--ok)}.badge.ex{background:var(--or)}
.qt{font-size:21px;font-weight:700;margin:0}
.cond{margin:0;font-size:19px}
.tgrid{display:flex;flex-direction:column;gap:12px}
.tfig{display:flex;justify-content:center}.tfig>.plot{width:100%;max-width:560px}
.tfig .pans{width:100%;max-width:600px}.pan .plot{width:100%}
.twork{display:flex;flex-direction:column;gap:10px}
input.num{font-size:20px;width:68px;height:42px}input.num.s{width:60px}
select.sel{font-size:19px;height:42px;min-width:52px}
.keypad{max-width:420px}.keypad button{font-size:22px;height:44px}
.answer{line-height:2.3}
.work .line{line-height:2.3}
.ex{grid-template-columns:1fr}.ex-right{order:-1;display:flex;flex-direction:column;align-items:center;gap:4px}.ex-bot{display:flex;flex-direction:column;align-items:center;text-align:center}.ex-fig{display:flex;justify-content:center;width:100%}.ex-fig>.plot{width:100%;max-width:600px}
.ex .box{font-size:17px}
.seg button,.krow button{padding:3px 10px;font-size:17px}
.fbig{font-size:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:17px;padding:10px 18px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:var(--card);cursor:pointer}
.btn.alt{background:transparent;color:var(--acc)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{font-weight:700}
.fb{border-radius:12px;padding:10px 14px;font-size:17px}
.fb.ok{background:var(--oksoft);color:var(--ok)}.fb.bad{background:var(--badsoft);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}.fb .ansx{color:var(--ink)}
.navb{display:flex;gap:10px;justify-content:space-between;align-items:center}
.navb .cnt{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
input.name{font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.result{text-align:center;align-items:center}
.big{font-size:56px;font-weight:800;color:var(--acc);line-height:1}
.grade{font-size:20px;font-weight:600}
.topics{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:16px}
.tp .meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.tp .meter span{display:block;height:100%;background:var(--ok)}
.review{text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.review div{border-left:4px solid var(--bad);background:var(--badsoft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:16px}
@media (max-width:520px){.q{padding:14px}.cond{font-size:17px}body{font-size:17px}.ex .box{font-size:16px}input.num{width:56px}input.num.s{width:52px}.keypad button{height:42px}}
@media (prefers-reduced-motion:no-preference){.q{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
.legend.big{font-size:19px;gap:4px 18px}.legend .lgh{color:var(--muted)}
.pans.p3{grid-template-columns:1fr 1fr}.pcap select.sel{height:38px}
.haspans .tfig{flex-direction:column;align-items:stretch}
.toc{display:grid;gap:10px}
.tocb{font:inherit;text-align:left;display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink);cursor:pointer}
.tocb:hover{border-color:var(--acc)}
.tocb b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--card);display:grid;place-items:center}
.tocb span{font-weight:700;font-size:19px}.tocb small{display:block;font-weight:400;color:var(--muted);font-size:16px}
.bar2{display:flex;gap:12px;align-items:center}.bar2:empty{display:none}.btn.sm{padding:6px 12px;font-size:15px}.secn{font-size:17px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mkc{border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mkf{font-size:19px;font-weight:700}.mkc .plot{width:100%;max-width:240px}.mkt{font-size:15px;text-align:center;line-height:1.3}
.mkl{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg{display:inline-block;width:30px;border-top:4px solid}.lg.b{border-color:var(--blue);border-top-style:dashed}.lg.o{border-color:var(--or)}
@media (max-width:420px){.mk{grid-template-columns:1fr}}
.v{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.nw{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.rt{white-space:nowrap}.rt>span{display:inline-block;border-top:2px solid currentColor;padding:2px 3px 0 2px;margin-left:-1px;line-height:1.25}
.pa{color:var(--or);font-weight:800}
.plot{display:block;max-width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none}
.plot .pbg{fill:var(--plbg)}
.plot .grid line{stroke:var(--plgrid);stroke-width:1}
.plot .axes line{stroke:var(--plax);stroke-width:2}
.plot .axes polygon{fill:var(--plax)}
.plot text{font-family:"Segoe UI",Roboto,Arial,sans-serif}
.plot .num{fill:var(--muted);paint-order:stroke;stroke:var(--plbg);stroke-width:4px;stroke-linejoin:round}
.plot .an{font-family:Georgia,serif;font-style:italic;font-weight:700;fill:var(--ink)}
.dragable{cursor:grab}.dragc.drag .crv{stroke-width:6}
.crv{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.crv.c-ghost{stroke:var(--ghost);stroke-dasharray:10 8;stroke-width:3}
.crv.c-ghost.c-blue{stroke:var(--blue)}
.crv.c-base{stroke:var(--blue)}.crv.c-new{stroke:var(--or)}
.crv.c1{stroke:var(--k1)}.crv.c2{stroke:var(--k2)}.crv.c3{stroke:var(--k3)}
.crv.c-ok{stroke:var(--ok);stroke-dasharray:3 9;stroke-width:6}
.crv.c-fade{stroke:var(--bad);stroke-dasharray:6 6}
.crv.right{stroke:var(--ok)}.crv.wrong{stroke:var(--bad)}
.pt{stroke-width:3;fill:var(--plbg)}
.pt.c-new{stroke:var(--or);fill:var(--or)}.pt.c-ghost{stroke:var(--ghost)}.pt.c-base{stroke:var(--blue);fill:var(--blue)}
.pt.c1{fill:var(--k1);stroke:var(--k1)}.pt.c2{fill:var(--k2);stroke:var(--k2)}.pt.c3{fill:var(--k3);stroke:var(--k3)}
.arr line{stroke:var(--or);stroke-width:2.5;stroke-dasharray:6 5}.arr polygon{fill:var(--or)}
line.dash{stroke:var(--ghost);stroke-width:2.5;stroke-dasharray:6 5}
line.dash.c1{stroke:var(--k1)}line.dash.c2{stroke:var(--k2)}
.symax{stroke:var(--blue);stroke-width:10;opacity:.22}.symax.s2{stroke:var(--or)}
.lab{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:21px;fill:var(--ink);paint-order:stroke;stroke:var(--plbg);stroke-width:5px;stroke-linejoin:round}
.vtx{fill:var(--or);stroke:var(--plbg);stroke-width:2.5;transition:r .15s}.vtx.act{r:12}.vtx.right{fill:var(--ok)}.vtx.wrong{fill:var(--bad)}
.vhit{fill:transparent;cursor:ns-resize}
.tag{fill:var(--plbg);stroke-width:3.5}.tag.c1{stroke:var(--k1)}.tag.c2{stroke:var(--k2)}.tag.c3{stroke:var(--k3)}
.tagt{text-anchor:middle;font-weight:800;font-size:17px;fill:var(--ink)}
.cn{line-height:1;display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;border:3px solid;font-weight:800;font-size:.85em;vertical-align:middle}
.cn.c1{border-color:var(--k1);color:var(--k1)}.cn.c2{border-color:var(--k2);color:var(--k2)}.cn.c3{border-color:var(--k3);color:var(--k3)}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pan{background:var(--card,#fff);border:2px solid var(--line);border-radius:12px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center}
.pcap{font-size:.9em;margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin:4px 0 8px}
.legend span{white-space:nowrap}
input.num{font:inherit;font-weight:700;text-align:center;border:3px solid var(--line);border-radius:12px;background:var(--inbg);color:var(--ink);-webkit-user-select:text;user-select:text;vertical-align:middle}
input.num:focus,input.num.foc{outline:none;border-color:var(--or);box-shadow:0 0 0 4px rgba(217,102,31,.22)}
select.sel{font:inherit;font-weight:700;border-radius:12px;border:3px solid var(--line);background:var(--inbg);color:var(--ink);cursor:pointer;vertical-align:middle;padding:0 4px}
input.num.right,select.sel.right{border-color:var(--ok);background:var(--oksoft);color:var(--ok)}
input.num.wrong,select.sel.wrong{border-color:var(--bad);background:var(--badsoft);color:var(--bad)}
.sc{margin:0 3px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.keypad button{font:inherit;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--card,#fff);cursor:pointer;color:var(--ink)}
.keypad button:active{background:var(--accsoft)}
.answer{border:3px solid var(--ok);border-radius:14px;padding:6px 14px;margin:10px 0 6px;line-height:2.05}
.work .line{margin:4px 0;line-height:2.05}
.work .note{color:var(--muted);margin:2px 0 6px}
.ex{display:grid;gap:20px}
.box{border-radius:14px;padding:8px 16px;border:3px solid var(--acc);margin:0 0 10px;background:var(--card,#fff)}
.box.soft{border-color:var(--line)}.box.warm{border-color:var(--or);background:var(--orsoft)}
.hl{color:var(--acc);font-weight:700}.hl2{color:var(--or);font-weight:700}.or{color:var(--or)}.gr{color:var(--ok)}.rd{color:var(--bad)}
.small{font-size:.86em}.muted{color:var(--muted)}
.seg,.krow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.seg button,.krow button{font:inherit;border:3px solid var(--line);background:var(--card,#fff);color:var(--ink);border-radius:12px;padding:4px 14px;cursor:pointer}
.seg button.cur,.krow button.cur{border-color:var(--or);background:var(--orsoft)}
.krow>span{min-width:7.2em}
.fbig{font-size:1.45em;font-weight:600;margin:8px 0 2px;min-height:1.5em}
.cap{min-height:1.4em}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:10px 0}
.stp{display:inline-flex;align-items:center;gap:8px;font-size:1.15em;white-space:nowrap}
.stp button{font:inherit;font-weight:800;width:1.9em;height:1.9em;border-radius:50%;border:3px solid var(--or);background:var(--card,#fff);color:var(--or);cursor:pointer;line-height:1}
.stp output{min-width:1.8em;text-align:center;font-weight:800;color:var(--or)}
.hint2{color:var(--muted);font-size:.85em}
.locked .vhit,.locked .plot{cursor:default}
.fl{font-size:24px;font-weight:700;white-space:nowrap;line-height:44px;font-family:"Segoe UI",Roboto,Arial,sans-serif;text-shadow:0 0 3px var(--plbg),0 0 3px var(--plbg),0 0 4px var(--plbg)}.fl-new{color:var(--or)}.fl-ghost{color:var(--ghost)}.fl .pa{color:inherit}
.tfig.stepfig{flex-direction:column;align-items:center;gap:6px}.stepcap{text-align:center;font-size:1.05em;min-height:1.5em}
.fprev{font-size:1.35em;font-weight:600;text-align:center;min-height:1.6em;margin-top:4px}.fprev .muted{font-size:.7em;font-weight:400;margin-right:6px}

/* ===== Тема оформлення учнівського тренажера (світла, яскрава) ===== */
:root{
 color-scheme:light;
 --bg:#edf5ff; --card:#fff; --ink:#14264a; --muted:#526786;
 --line:#cbdcf4; --acc:#145bd7; --accsoft:#e2efff;
 --ok:#07865f; --oksoft:#dcf8ed; --bad:#d93650; --badsoft:#ffe5e9;
 --or:#ef7617; --orsoft:#fff0dc; --blue:#1768df;
 --plbg:#fbfdff; --plgrid:#dce8f7; --plax:#243e68; --ghost:#9aaec9;
 --k1:#e34d64; --k2:#079b77; --k3:#8050d4; --inbg:#fff;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;
 --bg:#edf5ff; --card:#fff; --ink:#14264a; --muted:#526786; --line:#cbdcf4; --acc:#145bd7; --accsoft:#e2efff;
 --ok:#07865f; --oksoft:#dcf8ed; --bad:#d93650; --badsoft:#ffe5e9; --or:#ef7617; --orsoft:#fff0dc; --blue:#1768df;
 --plbg:#fbfdff; --plgrid:#dce8f7; --plax:#243e68; --ghost:#9aaec9; --k1:#e34d64; --k2:#079b77; --k3:#8050d4; --inbg:#fff}}
body{
 background:
  radial-gradient(circle at 4% 8%,rgba(36,137,255,.18),transparent 24rem),
  radial-gradient(circle at 96% 14%,rgba(255,166,62,.20),transparent 22rem),
  radial-gradient(circle at 80% 95%,rgba(128,80,212,.10),transparent 25rem),
  linear-gradient(145deg,#f5f9ff 0%,#eaf3ff 55%,#f4f2ff 100%);
 color:var(--ink); padding:26px 18px 46px; font-size:17px;
}
.wrap{max-width:940px;gap:20px}
/* шапка */
header{
 position:relative; overflow:hidden; isolation:isolate;
 padding:32px 32px 29px; border-radius:28px; color:#fff;
 background:linear-gradient(115deg,#073b91 0%,#1269dc 54%,#654bd2 100%);
 box-shadow:0 16px 34px rgba(21,75,163,.24);
}
header:before,header:after{content:"";position:absolute;z-index:-1;border:1px solid rgba(255,255,255,.2);border-radius:50%}
header:before{width:240px;height:240px;right:-55px;top:-135px;border-color:rgba(255,255,255,.24);box-shadow:0 0 0 25px rgba(255,255,255,.07),0 0 0 54px rgba(255,255,255,.045)}
header:after{width:115px;height:115px;right:150px;bottom:-82px;background:rgba(255,205,88,.18)}
.eyebrow{color:#ffe08a;font-size:12px;letter-spacing:.14em;font-weight:800;margin-bottom:8px}
h1{color:#fff;font-size:clamp(27px,5vw,39px);line-height:1.12;max-width:650px;letter-spacing:-.035em;text-shadow:0 2px 12px rgba(0,25,85,.18)}
header .hint{color:#eef5ff;font-size:15px;max-width:700px;margin-top:12px}
.secn{color:#19417d;font-size:16px}
/* картки */
.q{background:rgba(255,255,255,.98);border:1px solid #d5e3f6;border-radius:23px;padding:24px;gap:16px;
 box-shadow:0 9px 26px rgba(24,62,119,.09),0 2px 4px rgba(24,62,119,.04)}
.q:nth-of-type(odd){border-top:4px solid #3d83ed}
.q:nth-of-type(even){border-top:4px solid #22a88b}
.qn{font-size:13px;color:#506687;gap:9px}
.badge{border-radius:999px;padding:5px 12px;font-size:12px;letter-spacing:.02em;background:linear-gradient(135deg,#1269dc,#398cf3);box-shadow:0 3px 8px rgba(18,105,220,.2)}
.badge.pr{background:linear-gradient(135deg,#07865f,#20b78c)}
.badge.ex{background:linear-gradient(135deg,#e86a13,#ffad35)}
.qt{font-size:clamp(19px,3vw,23px);line-height:1.3;color:#15366e;font-weight:800}
.cond{font-size:19px;line-height:1.55;color:#1a2b4a;font-weight:500}
/* зміст */
.toc{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.tocb{min-width:0;min-height:86px;position:relative;overflow:hidden;
 border:2px solid #d3e3f7;border-radius:19px;padding:15px 17px;
 background:linear-gradient(135deg,#fff 0%,#f4f8ff 100%);
 box-shadow:0 5px 14px rgba(25,69,133,.07);
 transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.tocb:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-40px;bottom:-52px;background:rgba(82,103,223,.07)}
.tocb:hover{transform:translateY(-2px);border-color:#5794ee;box-shadow:0 10px 22px rgba(25,69,133,.14)}
.tocb b{width:42px;height:42px;font-size:17px;color:#fff;background:linear-gradient(145deg,#1269dc,#49a0ff);box-shadow:0 5px 12px rgba(18,105,220,.24)}
.tocb:nth-child(4n+2) b{background:linear-gradient(145deg,#07865f,#31c69b)}
.tocb:nth-child(4n+3) b{background:linear-gradient(145deg,#7543c8,#aa75f1)}
.tocb:nth-child(4n) b{background:linear-gradient(145deg,#e96b16,#ffae35)}
.tocb span{color:#172c52;font-size:18px;line-height:1.3;min-width:0}
/* формула в змісті: окремим рядком під назвою, курсивом лише букви */
.tocb small{display:table;margin-top:7px;padding:3px 10px 4px;border-radius:9px;
 font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;line-height:1.3;
 color:#0756c9;background:#e5efff;border:1px solid #c5dcff}
.tocb:nth-child(4n+2) small{color:#08734f;background:#e1f7ed;border-color:#b9e9d2}
.tocb:nth-child(4n+3) small{color:#6836ae;background:#f0e8ff;border-color:#d9c5ff}
.tocb:nth-child(4n) small{color:#b94e0b;background:#fff0df;border-color:#ffd4a8}
.tocb small.plain{font-family:inherit;font-size:14px;font-weight:600;background:none;border:0;padding:0;color:#5c7192}
/* кнопки */
.btn{border:0;border-radius:13px;padding:11px 18px;color:#fff;

<body><div class="wrap">
<header>
  <div class="eyebrow">Алгебра 9 · Тренажер</div>
  <h1>Перетворення графіків функцій</h1>
  <div class="hint" id="intro">Обери розділ. У кожному — пояснення з рухомим графіком, вправа як на уроці і нова вправа (її можна змінювати скільки завгодно).</div>
</header>
<div class="bar2" id="bar"></div>
<div class="toc" id="toc"></div>
<div id="main"></div>
<div class="navb" id="navb" hidden><button class="btn alt" id="back">◀ Назад</button><span class="cnt" id="cnt"></span><button class="btn" id="fwd">Вперед ▶</button></div>
<footer class="hint" style="text-align:center;margin-top:8px">© Сидорчук Н.В., 2026</footer>
</div>

<script>/* ===== Перетворення графіків: спільний рушій (дошка + учнівський) ===== */
const NS='http://www.w3.org/2000/svg';
function sv(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(par)par.appendChild(e);return e}
function hEl(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
let UID=0;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(owner,dur,fn){const tok=owner._tok=(owner._tok||0)+1;
  return new Promise(r=>{const t0=performance.now();
    function f(now){if(owner._tok!==tok)return r(false);const t=Math.min(1,(now-t0)/dur);fn(ease(t));t<1?requestAnimationFrame(f):r(true)}
    requestAnimationFrame(f)})}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(a,b,st){const r=[];for(let x=a;x<=b+1e-9;x+=st)r.push(+x.toFixed(6));return r}
const mapP=(polys,f)=>polys.map(p=>p.map(f));
const shiftP=(polys,dx,dy)=>mapP(polys,([x,y])=>[x+dx,y+dy]);
function dens(pts,n=30){const r=[];for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,d]=pts[i+1];for(let j=0;j<n;j++){const t=j/n;r.push([a+(c-a)*t,b+(d-b)*t])}}r.push(pts[pts.length-1].slice());return[r]}

/* ---------- запис формул ---------- */
const V=t=>`<i class="v">${t}</i>`;
const nw=t=>`<span class="nw">${t}</span>`;
const M=n=>n<0?'−'+(-n):''+n;
const FR=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const RT=t=>`<span class="rt">√<span>${t}</span></span>`;
const HALF=FR(1,2);
const hl=(t,on)=>on?`<span class="pa">${t}</span>`:t;
function ARG(a,on){return a===0?V('x'):`${V('x')} ${a>0?'+':'−'} ${hl(Math.abs(a),on)}`}
function TAIL(b,on){return b===0?'':` ${b>0?'+':'−'} ${hl(Math.abs(b),on)}`}
const fx=nw(V('f')+'('+V('x')+')');
const PT=(n,x,y)=>nw(`${n}(${M(x)};&nbsp;${M(y)})`);
const OX=V('Ox'),OY=V('Oy');

const BASES={
  sq:{la:[2,4],nm:'параболу',polys:()=>[rng(-14,14,.05).map(x=>[x,x*x])],tex:a=>a?`(${ARG(a.v,a.h)})<sup>2</sup>`:`${V('x')}<sup>2</sup>`,
      key:[[-2,4],[-1,1],[0,0],[1,1],[2,4]],view:{x0:-7,x1:7,y0:-6,y1:8},lab:1.5,start:'Вершину'},
  sqrt:{la:[6.25,2.5],nm:'графік',polys:()=>[rng(0,6.2,.02).map(t=>[t*t,t])],tex:a=>RT(a?ARG(a.v,a.h):V('x')),
      key:[[0,0],[1,1],[4,2]],view:{x0:-6,x1:10,y0:-5,y1:7},lab:6.25,start:'Початкову точку'},
  hyp:{la:[2,2],nm:'гіперболу',polys:()=>{const L=rng(Math.log(.06),Math.log(40),.02).map(Math.exp);return[L.map(x=>[x,4/x]),L.map(x=>[-x,-4/x])]},
      tex:a=>FR(4,a?ARG(a.v,a.h):V('x')),key:[[1,4],[2,2],[4,1],[-1,-4],[-2,-2],[-4,-1]],view:{x0:-8,x1:8,y0:-7,y1:7},lab:5}
};
/* y = base(x + a) + b */
function FX(base,a,b,h){return nw(`${V('y')} = ${BASES[base].tex(a?{v:a,h}:null)}${TAIL(b,h)}`)}
const BN=(base)=>`${BASES[base].nm} ${FX(base,0,0)}`;

/* ---------- координатна площина ---------- */
class Plot{
  constructor(host,o){o=Object.assign({x0:-6,x1:6,y0:-6,y1:6,u:40},o);Object.assign(this,o);
    const W=this.W=(o.x1-o.x0)*o.u,H=this.H=(o.y1-o.y0)*o.u;
    const s=this.svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot'});host.appendChild(s);
    const id='cp'+(++UID),defs=sv('defs',{},s),cp=sv('clipPath',{id},defs);sv('rect',{x:0,y:0,width:W,height:H},cp);
    sv('rect',{x:0,y:0,width:W,height:H,class:'pbg'},s);
    const gg=sv('g',{class:'grid'},s);
    for(let x=Math.ceil(o.x0);x<=o.x1;x++)sv('line',{x1:this.X(x),y1:0,x2:this.X(x),y2:H},gg);
    for(let y=Math.ceil(o.y0);y<=o.y1;y++)sv('line',{x1:0,y1:this.Y(y),x2:W,y2:this.Y(y)},gg);
    const ax=sv('g',{class:'axes'},s),fs=Math.round(clamp(o.u*.42,12,19)),X0=this.X(0),Y0=this.Y(0);
    const txt=(x,y,t,a,c)=>{const e=sv('text',{x,y,'text-anchor':a||'middle',class:c||'num','font-size':fs},ax);e.textContent=t;return e};
    if(o.y0<0&&o.y1>0){sv('line',{x1:0,y1:Y0,x2:W-3,y2:Y0},ax);sv('polygon',{points:`${W},${Y0} ${W-13},${Y0-5.5} ${W-13},${Y0+5.5}`},ax);
      txt(W-8,Y0-9,'x','end','an');
      for(let x=Math.ceil(o.x0+.5);x<=o.x1-.6;x++)if(x&&x%(o.lab||1)===0)txt(this.X(x),Y0+fs+2,M(x))}
    if(o.x0<0&&o.x1>0){sv('line',{x1:X0,y1:H,x2:X0,y2:3},ax);sv('polygon',{points:`${X0},0 ${X0-5.5},13 ${X0+5.5},13`},ax);
      txt(X0+9,fs,'y','start','an');
      for(let y=Math.ceil(o.y0+.5);y<=o.y1-.6;y++)if(y&&y%(o.lab||1)===0)txt(X0-5,this.Y(y)+fs*.36,M(y),'end')}
    if(o.y0<0&&o.y1>0&&o.x0<0&&o.x1>0)txt(X0-5,Y0+fs+1,'0','end');
    this.g=sv('g',{'clip-path':`url(#${id})`},s);this.top=sv('g',{},s);
  }
  X(x){return(x-this.x0)*this.u}
  Y(y){return(this.y1-y)*this.u}
  d(polys){let s='';for(const p of polys){let pen=false;for(const[x,y]of p){if(!isFinite(x)||!isFinite(y)||Math.abs(y)>200||Math.abs(x)>200){pen=false;continue}
    s+=(pen?'L':'M')+this.X(x).toFixed(1)+','+this.Y(y).toFixed(1);pen=true}}return s}
  path(polys,cls,par){return sv('path',{d:this.d(polys),class:'crv '+(cls||'')},par||this.g)}
  dot(x,y,cls,par,r){return sv('circle',{cx:this.X(x),cy:this.Y(y),r:r||6.5,class:'pt '+(cls||'')},par||this.top)}
  label(x,y,t,cls,dx=8,dy=-8,par){const e=sv('text',{x:this.X(x)+dx,y:this.Y(y)+dy,class:'lab '+(cls||'')},par||this.top);e.innerHTML=t;return e}
  arrow(x1,y1,x2,y2,cls,par){const a=this.X(x1),b=this.Y(y1),c=this.X(x2),d=this.Y(y2),L=Math.hypot(c-a,d-b);const g=sv('g',{class:'arr '+(cls||'')},par||this.g);
    if(L<4)return g;const ux=(c-a)/L,uy=(d-b)/L,hs=Math.min(13,L*.5);
    sv('line',{x1:a,y1:b,x2:c-ux*hs*.8,y2:d-uy*hs*.8},g);
    sv('polygon',{points:`${c},${d} ${c-ux*hs-uy*hs*.45},${d-uy*hs+ux*hs*.45} ${c-ux*hs+uy*hs*.45},${d-uy*hs-ux*hs*.45}`},g);return g}
  flab(x,y,html,cls,par){const X=this.X(x),Y=this.Y(y),w=360,h=46,left=X>this.W*.6;
    const fo=sv('foreignObject',{x:clamp(left?X-w-12:X+12,2,this.W-w-2),y:clamp(Y-h-2,2,this.H-h-2),width:w,height:h},par||this.top);
    const d=document.createElement('div');d.className='fl '+(cls||'');d.style.textAlign=left?'right':'left';d.innerHTML=html;fo.appendChild(d);return fo}
  toU(e){const p=this.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(this.svg.getScreenCTM().inverse());return[this.x0+q.x/this.u,this.y1-q.y/this.u]}
}

/* графік, який перетягують (зсув уздовж осей) */
function dragCurve(P,polys,o){o=Object.assign({axis:'xy',lim:[-5,5,-5,5],cls:'c-new'},o);
  const g=sv('g',{class:'dragc'},P.g),vis=sv('path',{class:'crv '+o.cls},g);
  const st={dx:0,dy:0,locked:false,_tok:0};
  const draw=()=>{vis.setAttribute('d',P.d(shiftP(polys,st.dx,st.dy)));o.onmove&&o.onmove(st)};draw();
  P.svg.classList.add('dragable');let s0=null;
  P.svg.addEventListener('pointerdown',e=>{if(st.locked)return;e.preventDefault();P.svg.setPointerCapture(e.pointerId);const[x,y]=P.toU(e);s0={x,y,dx:st.dx,dy:st.dy};st._tok++;g.classList.add('drag');vis.classList.remove('right','wrong')});
  P.svg.addEventListener('pointermove',e=>{if(!s0)return;const[x,y]=P.toU(e);
    if(o.axis!=='y')st.dx=clamp(s0.dx+x-s0.x,o.lim[0],o.lim[1]);if(o.axis!=='x')st.dy=clamp(s0.dy+y-s0.y,o.lim[2],o.lim[3]);draw()});
  const up=()=>{if(!s0)return;s0=null;g.classList.remove('drag');api.set(Math.round(st.dx),Math.round(st.dy),true).then(()=>o.onchange&&o.onchange(st))};
  P.svg.addEventListener('pointerup',up);P.svg.addEventListener('pointercancel',up);
  const api={st,vis,draw,set(dx,dy,anim){const a=st.dx,b=st.dy;if(!anim){st._tok=(st._tok||0)+1;st.dx=dx;st.dy=dy;draw();return Promise.resolve()}
      return tween(st,Math.max(180,Math.hypot(dx-a,dy-b)*160),t=>{st.dx=a+(dx-a)*t;st.dy=b+(dy-b)*t;draw()})},
    mark(ok){vis.classList.toggle('right',ok);vis.classList.toggle('wrong',!ok)},clear(){vis.classList.remove('right','wrong')}};
  return api}

/* ламана з вершинами, які перетягують вертикально */
function builder(P,start,target,o){o=o||{};
  const g=sv('g',{class:'bld'},P.top),line=sv('path',{class:'crv c-new'},P.g);
  const pts=start.map(p=>p.slice()),st={locked:false};
  const draw=()=>{line.setAttribute('d',P.d([pts]));pts.forEach((p,i)=>{cs[i].setAttribute('cy',P.Y(p[1]));hs[i].setAttribute('cy',P.Y(p[1]))})};
  const cs=[],hs=[];
  pts.forEach((p,i)=>{const c=sv('circle',{cx:P.X(p[0]),cy:P.Y(p[1]),r:8.5,class:'vtx'},g);const hh=sv('circle',{cx:P.X(p[0]),cy:P.Y(p[1]),r:24,class:'vhit'},g);cs.push(c);hs.push(hh);
    let on=false;
    hh.addEventListener('pointerdown',e=>{if(st.locked)return;e.preventDefault();e.stopPropagation();hh.setPointerCapture(e.pointerId);on=true;c.classList.add('act');c.classList.remove('right','wrong');line.classList.remove('right','wrong')});
    hh.addEventListener('pointermove',e=>{if(!on)return;const[,y]=P.toU(e);pts[i][1]=clamp(Math.round(y),Math.ceil(P.y0),Math.floor(P.y1));draw()});
    const up=()=>{on=false;c.classList.remove('act')};hh.addEventListener('pointerup',up);hh.addEventListener('pointercancel',up)});
  draw();
  return{st,
    check(){let ok=true;pts.forEach((p,i)=>{const r=p[1]===target[i][1];cs[i].classList.toggle('right',r);cs[i].classList.toggle('wrong',!r);if(!r)ok=false});
      line.classList.toggle('right',ok);line.classList.toggle('wrong',!ok);return ok},
    solve(){const a=pts.map(p=>p[1]);cs.forEach(c=>c.classList.remove('wrong'));line.classList.remove('wrong');
      return tween(st,700,t=>{pts.forEach((p,i)=>p[1]=a[i]+(target[i][1]-a[i])*t);draw()}).then(()=>{pts.forEach((p,i)=>p[1]=target[i][1]);draw();this.check()})},
    overlay(){P.path([target],'c-ok')},
    reset(){st._tok=(st._tok||0)+1;start.forEach((p,i)=>pts[i][1]=p[1]);cs.forEach(c=>c.classList.remove('right','wrong'));line.classList.remove('right','wrong');draw()}}}

/* ---------- поля введення ---------- */
const N=(a,w)=>`<input class="num${w?' '+w:''}" data-a="${M(a)}" inputmode="none" autocomplete="off">`;
function SEL(a,opts,cls){return`<select class="sel ${cls||''}" data-a="${a}"><option value=""></option>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`}
const DIRV=['вгору','вниз'],DIRH=['вліво','вправо'],AX=['Ox','Oy'],SG=['+','−'],LET=['А','Б','В','Г'];
const PTIN=(n,x,y)=>nw(`${n}(${N(x,'s')}<span class="sc">;</span>${N(y,'s')})`);

/* ---------- маленькі графіки ламаних ---------- */
function panel(host,pts,cls,cap,view){const w=hEl('div','pan');host.appendChild(w);
  const P=new Plot(w,Object.assign({x0:-5,x1:5,y0:-5,y1:5,u:30,lab:2},view||{}));P.path(dens(pts,2),cls);pts.forEach(p=>P.dot(p[0],p[1],cls+' sm',P.top,4.5));
  w.appendChild(hEl('div','pcap',cap));return P}

/* ================= ВПРАВИ ================= */
const tf={ neg:p=>[p[0],-p[1]], negx:p=>[-p[0],p[1]], both:p=>[-p[0],-p[1]] };
const SYMF=[nw(`${V('y')} = −${fx}`),nw(`${V('y')} = ${V('f')}(−${V('x')})`),nw(`${V('y')} = −${V('f')}(−${V('x')})`)];
const KF=[nw(`${V('y')} = 2${fx}`),nw(`${V('y')} = ${V('f')}(2${V('x')})`),nw(`${V('y')} = ${HALF}${fx}`),nw(`${V('y')} = ${V('f')}(${HALF}${V('x')})`)];
const legend=(opts,big)=>`<div class="legend${big?' big':''}">${big?'<span class="lgh">Формули:</span>':''}${opts.map((o,i)=>`<span><b>${LET[i]})</b> ${o}</span>`).join('')}</div>`;
const PSEL=(i,a,n)=>`<span class="nw"><b class="cn c${i+1}">${i+1}</b> <b>Відповідь:</b> ${SEL(a,LET.slice(0,n))}</span>`;
function randPoly(xs,ys){return xs.map(x=>[x,pick(ys)])}
const same=(a,b)=>a.length===b.length&&a.every((p,i)=>p[0]===b[i][0]&&p[1]===b[i][1]);
const sortX=a=>a.slice().sort((p,q)=>p[0]-q[0]);

const KINDS={
/* 1. Перетягни графік (вгору/вниз) */
K1:{sec:1,name:'Перетягни графік уздовж осі Oy',
  fixed:{base:'sq',b:-3},
  rand(){return{base:pick(['sq','sqrt','hyp']),b:pick([-4,-3,-2,-1,1,2,3,4])}},
  cond:d=>`Перетягни ${BN(d.base)} так, щоб отримати графік функції ${FX(d.base,0,d.b)}.`,
  build(T,d){const B=BASES[d.base],P=new Plot(T.fig,B.view);P.path(B.polys(),'c-ghost');
    const dc=dragCurve(P,B.polys(),{axis:'y',lim:[0,0,-5,5]});
    T.work.innerHTML=`<div class="line">${FX(d.base,0,d.b)}, &nbsp;${V('b')} = ${N(d.b)}</div>
    <div class="answer"><b>Відповідь:</b> ${BASES[d.base].nm} ${FX(d.base,0,0)} перенесли ${SEL(d.b>0?'вгору':'вниз',DIRV)} на ${N(Math.abs(d.b))}&nbsp;од.</div>`;
    return{items:[{check(){const ok=Math.round(dc.st.dy)===d.b;dc.mark(ok);return ok},solve(){return dc.set(0,d.b,true).then(()=>dc.mark(true))},
      overlay(){P.path(shiftP(B.polys(),0,d.b),'c-ok')},reset(){dc.set(0,0);dc.clear()},lock(v){dc.st.locked=v}}]}},
  ans:d=>`${FX(d.base,0,d.b)}: ${V('b')} = ${M(d.b)}, тому графік переносимо ${d.b>0?'вгору':'вниз'} на ${Math.abs(d.b)}&nbsp;од.`},

/* 2. Знайди формулу кожного графіка (вгору/вниз) */
K2:{sec:1,name:'Добери формулу до графіка',
  fixed:{base:'sqrt',bs:[2,-1,-3],opts:[-1,2,1,-3]},
  rand(){const base=pick(['sq','sqrt']);const v=shuffle([-3,-2,-1,0,1,2,3]);return{base,bs:v.slice(0,3),opts:shuffle(v.slice(0,4))}},
  cond:d=>`На рисунку графіки функцій виду ${nw(`${V('y')} = ${fx} + ${V('b')}`)}, де ${FX(d.base,0,0)}. Добери до кожного графіка його формулу.`,
  build(T,d){const B=BASES[d.base],P=new Plot(T.fig,B.view);P.path(B.polys(),'c-ghost');
    d.bs.forEach((b,i)=>{P.path(shiftP(B.polys(),0,b),'c'+(i+1));const y=(d.base==='sq'?B.lab*B.lab:d.base==='sqrt'?Math.sqrt(B.lab):4/B.lab)+b;
      sv('circle',{cx:P.X(B.lab),cy:P.Y(y),r:15,class:'tag c'+(i+1)},P.top);const t=sv('text',{x:P.X(B.lab),y:P.Y(y)+6,class:'tagt'},P.top);t.textContent=i+1});
    T.work.innerHTML=`<div class="line">Формули:</div>${legend(d.opts.map(b=>FX(d.base,0,b)))}
    <div class="note">Пунктиром показано графік ${FX(d.base,0,0)}.</div>

/* 8. k f(x) чи f(kx): добери формулу */

/* 9. Побудуй y = |f(x)| */
K9:{sec:5,name:'Побудуй графік y = |f(x)|',
  fixed:{f:[[-4,2],[-2,0],[1,-3],[4,0]]},

/* 11. Парабола: два зсуви */
K11:{sec:6,name:'Перетягни параболу',

  build(T,d){const B=BASES.sq,P=new Plot(T.fig,B.view);P.path(B.polys(),'c-ghost');

/* 12. Формула за графіком */
K12:{sec:6,name:'Запиши формулу за графіком',
  fixed:{base:'sqrt',a:3,b:-2},

  build(T,d){const B=BASES[d.base],P=new Plot(T.fig,B.view);P.path(B.polys(),'c-ghost');P.path(shiftP(B.polys(),-d.a,d.b),'c-new');

    <div class="answer"><b>Відповідь:</b> ${nw(`${V('y')} = ${body} ${SEL(d.b>0?'+':'−',SG,'sg')} ${N(Math.abs(d.b),'s')}`)}</div>`;

      pv.innerHTML=`<span class="muted">Твоя формула:</span> ${nw(`${V('y')} = ${d.base==='sq'?`(${arg})<sup>2</sup>`:RT(arg)} ${v[2]} ${v[3]}`)}`};

/* 13. Будуємо графік поступово: базова функція → зсув уздовж Ox → зсув уздовж Oy */

  cond:d=>`Побудуй графік функції ${FX(d.base,d.a,d.b)} поступово: спочатку базова функція, потім кожне перетворення окремо.`,
  build(T,d){const B=BASES[d.base],P=new Plot(T.fig,B.view);P.path(B.polys(),'c-ghost');

    const BOPT=['x²','√x','4/x'],bAns=BOPT[['sq','sqrt','hyp'].indexOf(d.base)];
    const mid=sv('g',{},P.g),vx=sv('g',{},P.top),lim=[-5,5,0,0];
    const cap=hEl('div','cap stepcap');T.fig.appendChild(cap);T.fig.classList.add('stepfig');

  const api=K.build(T,d)||{};const items=api.items||[];
  const tw=root.querySelector('.twork');if(T.fig.querySelector('.pans'))root.classList.add('haspans');
  const inputs=[...root.querySelectorAll('input.num')],sels=[...root.querySelectorAll('select.sel')];
  let last=null;
  if(inputs.length){const kp=hEl('div','keypad');KEYS.forEach(k=>{const b=hEl('button','',k);b.type='button';b.addEventListener('pointerdown',e=>e.preventDefault());
      b.onclick=()=>{if(R.locked)return;const inp=last||inputs.find(i=>!i.value)||inputs[0];inp.classList.remove('right','wrong');
        if(k==='⌫')inp.value=inp.value.slice(0,-1);else if(k==='−')inp.value=inp.value.startsWith('−')?inp.value.slice(1):'−'+inp.value;else inp.value+=k;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.focus()};kp.appendChild(b)});tw.appendChild(kp);
    inputs.forEach(i=>{i.addEventListener('focus',()=>{last=i;inputs.forEach(j=>j.classList.toggle('foc',j===i))});
      i.addEventListener('input',()=>{i.classList.remove('right','wrong');i.value=i.value.replace(/-/g,'−').replace(/[^0-9−.,]/g,'')})})}
  sels.forEach(s=>s.addEventListener('change',()=>s.classList.remove('right','wrong')));
  const R={root,kid,d,locked:false,
    check(markEmpty){let ok=0,n=0;
      inputs.forEach(i=>{n++;if(i.value.trim()===''&&!markEmpty){i.classList.remove('right','wrong');return}const r=numv(i.value)===numv(i.dataset.a);i.classList.toggle('right',r);i.classList.toggle('wrong',!r);if(r)ok++});
      sels.forEach(s=>{n++;if(s.value===''&&!markEmpty){s.classList.remove('right','wrong');return}const r=s.value===s.dataset.a;s.classList.toggle('right',r);s.classList.toggle('wrong',!r);if(r)ok++});
      items.forEach(it=>{n++;if(it.check())ok++});
      api.after&&api.after(ok===n);return{ok,n}},
    solve(){inputs.forEach(i=>{i.value=i.dataset.a;i.classList.remove('wrong');i.classList.add('right')});sels.forEach(s=>{s.value=s.dataset.a;s.classList.remove('wrong');s.classList.add('right')});
      items.forEach(it=>it.solve());api.solveHook&&api.solveHook()},
    overlay(){items.forEach(it=>it.overlay&&it.overlay());api.solveHook&&api.solveHook()},
    reset(){inputs.forEach(i=>{i.value='';i.classList.remove('right','wrong')});sels.forEach(s=>{s.value='';s.classList.remove('right','wrong')});items.forEach(it=>it.reset());api.resetHook&&api.resetHook()},
    lock(){R.locked=true;inputs.forEach(i=>i.readOnly=true);sels.forEach(s=>s.disabled=true);items.forEach(it=>it.lock&&it.lock(true));root.classList.add('locked')},
    tw,ans:K.ans(d)};
  inputs.forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=root.querySelector('[data-check]');b&&b.click()}}));

  L.forEach(e=>{e.hidden=true;main.appendChild(e)});return SCR[i]=L}
function toc(){sec=-1;Object.values(SCR).flat().forEach(e=>e.hidden=true);navb.hidden=true;bar.innerHTML='';document.getElementById('toc').hidden=false;document.getElementById('intro').hidden=false;scrollTo({top:0})}
function open(i,j){sec=i;document.getElementById('toc').hidden=true;document.getElementById('intro').hidden=true;buildSec(i);show(j||0)}
function show(j){const L=SCR[sec];idx=clamp(j,0,L.length-1);Object.values(SCR).flat().forEach(e=>e.hidden=true);L[idx].hidden=false;navb.hidden=false;
  const nm=sec===TS?`${TS+1}. Перевір себе`:sec===NS?'Підсумок':`${sec+1}. ${SECS[sec][0]}`;bar.innerHTML=`<button class="btn ghost sm" id="tocb">☰ Зміст</button><b class="secn">${nm}</b>`;
  document.getElementById('tocb').onclick=toc;
  cnt.textContent=L.length>1?`${idx+1} / ${L.length}`:'';
  document.getElementById('back').textContent=idx===0?'◀ Зміст':'◀ Назад';
  const last=idx===L.length-1;document.getElementById('fwd').textContent=last?(sec<NS?'Наступний розділ ▶':sec===NS?'Перевір себе ▶':'До змісту'):'Вперед ▶';
  if(sec===TS){const f=document.getElementById('fwd');f.hidden=(idx===0&&!TST.started)||(TST.done&&last)}else document.getElementById('fwd').hidden=false;scrollTo({top:0})}
document.getElementById('back').onclick=()=>idx===0?toc():show(idx-1);
document.getElementById('fwd').onclick=()=>{if(idx<SCR[sec].length-1)show(idx+1);else if(sec<=NS)open(sec+1);else toc()};
const t=document.getElementById('toc');
t.innerHTML=SECS.map((s,i)=>`<button class="tocb" data-s="${i}"><b>${i+1}</b><span>${s[0]}<small>${s[1]}</small></span></button>`).join('')+`<button class="tocb" data-s="${NS}"><b>${NS+1}</b><span>Підсумок<small class="plain">міні-конспект</small></span></button><button class="tocb tst" data-s="${TS}"><b>${TS+1}</b><span>Перевір себе<small class="plain">тест · 15 завдань · 12 балів</small></span></button>`;
t.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>open(+b.dataset.s));
toc();
})();
</script></body></html>
